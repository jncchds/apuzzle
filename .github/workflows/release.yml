# Builds every platform and publishes a GitHub release on pushes to
# release/X.Y.Z branches. The version comes from the branch name (the
# pubspec version is ignored) and the build number is the workflow run number,
# so every push produces a higher Android versionCode.
#
# Required secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD (also
# used as the key password) and ANDROID_KEY_ALIAS.
name: Release

on:
  push:
    branches: ['release/*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.5'

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.v.outputs.name }}
      number: ${{ steps.v.outputs.number }}
    steps:
      - id: v
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#release/}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Branch must be named release/X.Y.Z (got '$GITHUB_REF_NAME')"
            exit 1
          fi
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "number=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Set up signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEYSTORE_PASSWORD
          EOF
      - run: flutter pub get
      - name: Build APK and App Bundle
        run: |
          flutter build apk --release --build-name=${{ needs.version.outputs.name }} --build-number=${{ needs.version.outputs.number }}
          flutter build appbundle --release --build-name=${{ needs.version.outputs.name }} --build-number=${{ needs.version.outputs.number }}
      - name: Collect
        run: |
          mkdir dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/apuzzle-${{ needs.version.outputs.name }}-android.apk
          cp build/app/outputs/bundle/release/app-release.aab dist/apuzzle-${{ needs.version.outputs.name }}-android.aab
      # Android App Links: lets the app open share links without asking. Published
      # to the user site by the assetlinks job.
      - name: Generate assetlinks.json
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          fp=$(keytool -list -v -keystore android/upload-keystore.jks -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD" | awk '/SHA256:/ {print $2; exit}')
          if [ -z "$fp" ]; then
            echo "::error::Could not read the signing certificate fingerprint"
            exit 1
          fi
          mkdir assetlinks
          cat > assetlinks/assetlinks.json <<EOF
          [{
            "relation": ["delegate_permission/common.handle_all_urls"],
            "target": {"namespace": "android_app", "package_name": "ua.pp.chds.apuzzle", "sha256_cert_fingerprints": ["$fp"]}
          }]
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: assetlinks
          path: assetlinks/assetlinks.json
      - name: Remove signing material
        if: always()
        run: rm -f android/upload-keystore.jks android/key.properties
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release --build-name=${{ needs.version.outputs.name }} --build-number=${{ needs.version.outputs.number }}
      - name: Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/apuzzle-${{ needs.version.outputs.name }}-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  web:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --build-name=${{ needs.version.outputs.name }} --build-number=${{ needs.version.outputs.number }}
      - name: Zip
        run: |
          mkdir dist
          (cd build/web && zip -r "$GITHUB_WORKSPACE/dist/apuzzle-${{ needs.version.outputs.name }}-web.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist/*
      # Share links point at https://jncchds.github.io/apuzzle/ (lib/core/puzzle_code.dart).
      - run: flutter build web --release --base-href /apuzzle/ --output build/pages --build-name=${{ needs.version.outputs.name }} --build-number=${{ needs.version.outputs.number }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/pages

  # App Links are verified at the domain root, so assetlinks.json goes to the
  # user site repo (jncchds/jncchds.github.io, served from its default branch).
  # Needs the USER_SITE_TOKEN secret: a fine-grained token with Contents
  # read/write on that repo. Skipped with a warning when it is missing.
  assetlinks:
    needs: [test, android]
    runs-on: ubuntu-latest
    steps:
      - id: token
        shell: bash
        env:
          TOKEN: ${{ secrets.USER_SITE_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::USER_SITE_TOKEN is not set; assetlinks.json was not published"
            echo "set=false" >> "$GITHUB_OUTPUT"
          else
            echo "set=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.token.outputs.set == 'true'
        uses: actions/checkout@v4
        with:
          repository: jncchds/jncchds.github.io
          token: ${{ secrets.USER_SITE_TOKEN }}
          path: site
      - if: steps.token.outputs.set == 'true'
        uses: actions/download-artifact@v4
        with:
          name: assetlinks
          path: site/.well-known
      - if: steps.token.outputs.set == 'true'
        name: Commit and push
        shell: bash
        working-directory: site
        run: |
          touch .nojekyll # Jekyll would skip the dot-directory
          git add .nojekyll .well-known/assetlinks.json
          if git diff --cached --quiet; then
            echo "assetlinks.json is up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update APuzzle assetlinks.json"
          git push

  # Needs Settings → Pages → Source: "GitHub Actions".
  pages:
    needs: [test, web]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  ios:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # No Apple signing secrets yet: this is an unsigned build, for sideloading
      # tools that re-sign it (AltStore, Sideloadly, …).
      - run: flutter build ios --release --no-codesign --build-name=${{ needs.version.outputs.name }} --build-number=${{ needs.version.outputs.number }}
      - name: Package unsigned IPA
        run: |
          mkdir -p dist Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr dist/apuzzle-${{ needs.version.outputs.name }}-ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: dist/*

  release:
    needs: [version, test, android, windows, web, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.version.outputs.name }}
          VERSION: ${{ needs.version.outputs.name }}
          BUILD: ${{ needs.version.outputs.number }}
        run: |
          notes="APuzzle $VERSION (build $BUILD) from \`$GITHUB_REF_NAME\` @ ${GITHUB_SHA::7}.

          - Android: \`.apk\` to install directly, \`.aab\` for Google Play
          - Windows: unzip and run \`apuzzle.exe\`
          - Web: static files, serve from any web server
          - iOS: unsigned \`.ipa\`, re-sign with a sideloading tool"
          if gh release view "$TAG" > /dev/null 2>&1; then
            # A new push to the same release branch: point the tag at this
            # commit and replace the assets.
            git_ref="refs/tags/$TAG"
            gh api -X PATCH "repos/$GH_REPO/git/$git_ref" -f sha="$GITHUB_SHA" -F force=true
            gh release edit "$TAG" --notes "$notes"
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "APuzzle $VERSION" --notes "$notes"
          fi
